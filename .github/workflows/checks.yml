name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit tests (offline)
        run: python -m pytest tests -q
      - name: Release gates on the latest dump + viewer export
        run: |
          latest=$(ls data/composers_r*.tsv | sed -E 's/.*composers_(r[0-9]+)\.tsv/\1/' | sort | tail -1)
          python scripts/check_release.py --dump "$latest" --viewer-data viewer/data
