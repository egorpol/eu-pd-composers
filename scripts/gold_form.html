<script>
(() => {
"use strict";
const FIELDS = {
  c: ["wikidata_same_person", "imslp_check", "imslp_found_url", "death_status", "death_year", "death_source", "notes"],
  w: ["force_family", "genre_form", "has_files", "rights_basis", "notes"],
};
const SHEET_COLS = {
  c: ["item", "composer_id", "name", "wikipedia_url", "wikidata_url", "imslp_url", "gnd_id", "viaf_id"],
  w: ["item", "work_id", "composer", "title", "imslp_work_url"],
};
const FAMILIES = [
  ["piano_solo", "one pianist (left hand alone too)"],
  ["piano_ensemble", "two or more pianists or pianos, or piano with other keyboards"],
  ["organ", "organ alone"],
  ["keyboard_other", "harpsichord, clavichord, celesta, harmonium… alone"],
  ["solo_instrument", "one non-keyboard instrument, alone or with one keyboard"],
  ["guitar", "guitar or lute family; no voices, orchestra, band, electronics"],
  ["chamber", "two or more instrumentalists otherwise; no voices, no orchestra"],
  ["orchestral", "orchestra or string orchestra, no soloists"],
  ["concerto", "soloist(s) with orchestra or string orchestra"],
  ["wind_band", "wind or brass band, wind or brass ensemble"],
  ["solo_voice", "one or two voices, any accompaniment or none"],
  ["choral", "any chorus, or three or more voices alone"],
  ["stage_opera", "opera, operetta, musical, staged vocal work"],
  ["stage_ballet", "ballet"],
  ["film_media", "film, television or radio music"],
  ["electronic", "with electronics or tape; no voices, chorus, orchestra, band"],
  ["pedagogical", "methods, exercises, studies as teaching material"],
  ["other", "none of the above, or unspecified"],
];
const GENRES = [
  ["opera", "opera, operetta, singspiel, zarzuela or other staged sung drama"],
  ["ballet", "ballet or other staged dance work"],
  ["concerto", "called concerto, concertino, concerto grosso or sinfonia concertante"],
  ["symphony", "symphony, sinfonietta, or a sinfonia in several movements; a symphonic poem is not"],
  ["sonata", "sonata, sonatina or trio sonata, any instrumentation"],
  ["suite", "suite or partita: contrasting movements published as one work"],
  ["variations", "variations on a theme, under any title"],
  ["etude", "étude or study, alone or in a set; a method or exercise book is not"],
  ["prelude_fugue", "prelude, fugue or fughetta, alone or paired; chorale preludes count"],
  ["string_quartet", "for exactly 2 violins, viola and cello; other quartets are not"],
  ["dance", "dance or set of dances (waltz, mazurka, polonaise, minuet…); marches count"],
  ["mass_requiem", "Mass or Requiem, or a single movement or Proper text of one"],
  ["oratorio_cantata", "oratorio, cantata or Passion: unstaged, voices and instruments, several numbers"],
  ["overture_tone_poem", "concert overture, symphonic poem or tone poem"],
  ["song_cycle", "songs the composer published as one connected cycle"],
  ["song", "a song, Lied, mélodie, part-song or set of songs that is not a cycle"],
  ["none", "none of these applies (a nocturne, fantasia, motet, caprice, divertimento, serenade…)"],
];
const BASES = [
  ["eu_warning", "WorkNonPD-EU, WorkNonPD-USandEU"],
  ["us_only", "WorkPD-USonly: public domain in the US only (not \"Non-PD US\")"],
  ["licensed", "Works not in public domain, FileNonPD-PermissionGranted, Works Licensed through BMI / ASCAP / GEMA"],
  ["wima", "WIMA files"],
  ["us_routes", "Work-PD-US-notrenewed, PD-US-no notice"],
  ["none", "none of these; WorkNonPD-US alone (a US warning) counts as none"],
];
const TABS = [
  { id: "composers", label: "Composers", coll: "answers", src: "composers" },
  { id: "works", label: "Works", coll: "answers", src: "works" },
  { id: "practice", label: "Practice", coll: "practice", src: "practice" },
  { id: "recheck_c", label: "Re-check composers", coll: "recheck", src: "composers_recheck", lockOf: "composers" },
  { id: "recheck_w", label: "Re-check works", coll: "recheck", src: "works_recheck", lockOf: "works" },
  { id: "export", label: "Progress & export" },
];
const COLLS = ["answers", "recheck", "practice"];
// Sheet source in S.data → store collection → file in data/gold/<dump>/.
const SHEETS = [["composers", "answers", "composers_sheet.tsv"], ["works", "answers", "works_sheet.tsv"], ["composers_recheck", "recheck", "composers_recheck.tsv"], ["works_recheck", "recheck", "works_recheck.tsv"]];
// A sample without re-check items (a second annotator's overlap set) has no re-check tabs.
const shownTabs = () => TABS.filter(t => !t.lockOf || !S.data || S.data[t.src].length);
const DAY = 86400000;
const $ = (s, el = document) => el.querySelector(s);
const kindOf = it => (it.composer_id ? "c" : "w");
const enc = encodeURIComponent;

const store = {
  get(k) { try { return JSON.parse(localStorage.getItem("goldset." + k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem("goldset." + k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem("goldset." + k); } catch {} },
};

const S = {
  data: null, db: null, readOnly: false, connected: false,
  server: { answers: {}, recheck: {}, practice: {} },
  local: { answers: {}, recheck: {}, practice: {} },
  ver: {}, timers: {}, inflight: {}, again: {},
  tab: "composers", pos: {}, filter: "all", q: "",
  saveMsg: "", saveErr: false,
};
const saved = store.get("view");
if (saved && typeof saved === "object") { S.tab = saved.tab || S.tab; S.pos = saved.pos || {}; }

// ---------- values and status ----------
function val(coll, id) { return { ...(S.server[coll][id] || {}), ...(S.local[coll][id] || {}) }; }
function itemsOf(tab) {
  const d = S.data; if (!d || !tab.src) return [];
  return tab.src === "practice" ? [...d.practice.composers, ...d.practice.works] : d[tab.src];
}
function complete(kind, v, it) {
  if (kind === "w") return !!(v.force_family && v.genre_form && v.has_files && v.rights_basis);
  if (!v.wikidata_same_person || !v.imslp_check || !v.death_status) return false;
  if (v.imslp_check === "found" && !(v.imslp_found_url || "").trim()) return false;
  if (v.death_status !== "unknown" && !(v.death_source || "").trim()) return false;
  if (S.data.style) {
    if (!v.styles || !v.primary_period) return false;
    if (v.styles === "unknown" && v.primary_period !== "unknown") return false;
    if (v.styles !== "unknown" && !(v.style_source || "").trim()) return false;
  }
  return true;
}
function anyUnsure(kind, v) { return FIELDS[kind].some(f => v[f] === "unsure"); }
function status(kind, v, it) {
  const filled = FIELDS[kind].some(f => (v[f] || "").toString().trim());
  if (!filled) return "empty";
  if (!complete(kind, v, it)) return "partial";
  return anyUnsure(kind, v) ? "unsure" : "done";
}
function warnings(kind, v, it) {
  const w = [];
  const unsureFields = FIELDS[kind].filter(f => v[f] === "unsure");
  if (unsureFields.length && !(v.notes || "").trim()) w.push("You marked " + unsureFields.join(", ") + " as unsure. Write the reason in notes.");
  if (kind === "c") {
    if (v.imslp_check && it.imslp_url && ["found", "none"].includes(v.imslp_check)) w.push("This row has an IMSLP link, so the answer is same, different or unsure.");
    if (v.imslp_check && !it.imslp_url && ["same", "different"].includes(v.imslp_check)) w.push("This row has no IMSLP link, so the answer is found, none or unsure.");
    const u = (v.imslp_found_url || "").trim();
    if (v.imslp_check === "found" && !u) w.push("Paste the IMSLP category URL you found.");
    if (u && !/^https:\/\/imslp\.org\/wiki\/Category:/.test(u)) w.push("The found URL should start with https://imslp.org/wiki/Category:");
    const y = (v.death_year || "").trim();
    if (y && !/^\d{4}$/.test(y)) w.push("Death year must be four digits, like 1942.");
    if (/^\d{4}$/.test(y) && +y > new Date().getFullYear()) w.push("Death year is in the future.");
    if (y && v.death_status && v.death_status !== "dead") w.push("A death year only goes with dead. Clear it or change the status.");
    if (v.death_status === "dead" && !y) w.push("No death year: fine only if no source gives the year (say so in notes).");
    if (v.death_status && v.death_status !== "unknown" && !(v.death_source || "").trim()) w.push(v.death_status === "living"
      ? "Living needs dated evidence of life after 2020 (a recent premiere, staff page, interview). Name it in the source, with its URL."
      : "Name the source you relied on, with its URL.");
    if (S.data.style) {
      if (v.styles && v.styles !== "unknown" && !(v.style_source || "").trim()) w.push("Name the source for the style: Grove, MGG, a publisher's page… with its URL.");
      if (v.styles === "unknown" && v.primary_period && v.primary_period !== "unknown") w.push("You can name the period, so add its period tag to the style instead of unknown.");
      if (/wikidata/i.test(v.style_source || "")) w.push("Wikidata's movement statements are what the style is checked against: use another source.");
    }
  }
  return w;
}

// ---------- saving ----------
function edit(coll, id, field, value) {
  const k = coll + "/" + id;
  S.local[coll][id] = { ...val(coll, id), [field]: value };

  card.append(el("footer", { class: "card-foot" }, prev, next, todo, el("span", { class: "save" + (S.saveErr ? " err" : ""), id: "save", role: "status", text: S.saveMsg })));
  card.append(el("p", { class: "keys" }, "Keys outside text fields: ", el("kbd", { text: "j" }), " next, ", el("kbd", { text: "k" }), " previous, ", el("kbd", { text: "n" }), " next to do."));

  function syncWarn() {
    warnUl.textContent = "";
    for (const w of warnings(kind, v(), it)) warnUl.append(el("li", { text: w }));
  }
  function sync() {
    groups.forEach(g => g());
    if (kind === "c") {
      const cur = v();
      if (foundBox) foundBox.hidden = cur.imslp_check !== "found" && !(cur.imslp_found_url || "").trim();
      yearInp.disabled = cur.death_status !== "dead" && !(cur.death_year || "").trim();
    }
    syncWarn();
  }
  card._sync = sync;
  card._id = id;
  sync();
  return card;
}

function refreshStatus(coll, id) {
  const tab = curTab();
  if (tab.coll === coll) {
    const it = itemsOf(tab).find(x => x.item === id);
    const d = document.getElementById("dot-" + id);
    if (it && d) d.className = "dot " + status(kindOf(it), val(coll, id), it);
  }
  renderTabs();
}

function renderLock(main, tab, L) {
  const kindWord = tab.lockOf === "composers" ? "composers" : "works";
  const p = el("div", { class: "panel lock" });
  p.append(el("h2", { text: tab.label + " is locked" }));
  if (L.reason === "unfinished") {
    p.append(el("p", { text: "The re-check opens 7 days after you finish all " + L.p.total + " " + kindWord + ". " + L.p.left + " still need an answer." }));
  } else {
    const d = new Date(L.unlockAt);
    p.append(el("p", { text: "You finished the " + kindWord + " on " + new Date(L.p.finishedAt).toLocaleDateString() + ". The re-check opens on " + d.toLocaleDateString() + " at " + d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) + "." }));
  }
  p.append(el("p", { class: "help", text: "The wait is what makes the re-check a measure of consistency rather than memory. It holds " + S.data[tab.src].length + " of the same items in a new order, and you answer them without looking at your first answers." }));
  const b = el("button", { class: "nav", id: "early-" + tab.id, type: "button", text: "Open early…" });
  b.onclick = () => {
    if (b.dataset.armed) { store.set("early." + tab.id, true); render(); return; }
    b.dataset.armed = "1"; b.textContent = "Open now, ignoring the 7-day rule"; b.classList.add("primary");
  };
  p.append(el("div", { class: "row" }, b));
  main.append(p);
}

// rows: the answers a push sends, by item; without it, what this tab shows.
function tsvFor(src, coll, rows) {
  const kind = src.startsWith("composers") ? "c" : "w";
  const cols = [...SHEET_COLS[kind], ...FIELDS[kind]];
  // A cell holding a quote is quoted as pandas writes it, so a note opening with an unclosed quote can't swallow
  // the rows after it when the sheet is read back.
  const clean = s => { const t = String(s ?? "").replace(/[\t\r\n]+/g, " ").trim(); return t.includes('"') ? '"' + t.replace(/"/g, '""') + '"' : t; };
  const lines = [cols.join("\t")];
  for (const it of S.data[src]) {
    const v = rows ? rows[it.item] || {} : val(coll, it.item);
    lines.push(cols.map(c => clean(c in it ? it[c] : v[c])).join("\t"));
  }
  return lines.join("\n") + "\n";
}
function renderExport(main) {
  const wrap = el("div", { class: "panel" });
  wrap.append(el("h2", { text: "Progress" }));
  const stats = el("div", { class: "stats" });
  const C = setProgress("composers"), W = setProgress("works");
  const perComposer = S.data.style ? 8 : 3;
  const mins = C.left * perComposer + W.left;
  stats.append(
    el("div", { class: "stat" }, el("span", { class: "k", text: "Composers" }), el("span", { class: "v" }, String(C.done), el("small", { text: " / " + C.total }))),
    el("div", { class: "stat" }, el("span", { class: "k", text: "Works" }), el("span", { class: "v" }, String(W.done), el("small", { text: " / " + W.total }))),
    el("div", { class: "stat" }, el("span", { class: "k", text: "With unsure" }), el("span", { class: "v", text: String(C.unsure + W.unsure) })),
    el("div", { class: "stat" }, el("span", { class: "k", text: "Time left, est." }), el("span", { class: "v" }, String(Math.floor(mins / 60)), el("small", { text: " h " + (mins % 60) + " min" }))));
  wrap.append(stats);
  wrap.append(el("p", { class: "help", text: "Estimate: " + perComposer + " minutes per composer, 1 per work. Done means every required answer is filled; started items count as not done." }));
  wrap.append(el("h2", { text: "Export" }));
  const local = !window.claude?.use;
  wrap.append(el("p", { text: S.gh
    ? "Your answers are saved to GitHub a few seconds after each change, so there is nothing to send. Copy and Download below are only a backup. Practice answers stay in this browser."
    : "On claude.ai, Claude reads your answers from this page's store and writes them into data/gold/" + S.data.dump + "/. In a local copy, Copy a sheet to paste it over its file in your repository, or Download it to send by email. Each sheet is complete, as TSV in the original row order." }));
  const box = el("textarea", { class: "dump", id: "tsvbox", readonly: "", "aria-label": "Copied TSV" }); box.hidden = true;
  const ex = el("div", { class: "exports" });
  for (const [src, coll, file] of SHEETS.filter(([src]) => S.data[src].length)) {
    const msg = el("span", { class: "help", text: "" });
    const b = el("button", { class: "nav", type: "button", id: "copy-" + src, text: "Copy" });
    b.onclick = () => {
      const t = tsvFor(src, coll);
      const fallback = () => { box.hidden = false; box.value = t; box.focus(); box.select(); msg.textContent = "Copying is blocked here. The text is selected below; press Ctrl+C."; };
      try { navigator.clipboard.writeText(t).then(() => { msg.textContent = "Copied " + S.data[src].length + " rows."; }, fallback); } catch { fallback(); }
    };
    const d = local ? el("button", { class: "nav", type: "button", id: "dl-" + src, text: "Download" }) : null;
    if (d) d.onclick = () => {
      const url = URL.createObjectURL(new Blob([tsvFor(src, coll)], { type: "text/tab-separated-values" }));
      const a = el("a", { href: url, download: file }); document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      msg.textContent = "Saved " + file + " to your downloads.";
    };
    ex.append(el("div", { class: "exp" }, el("span", { class: "mono", text: file }), b, d, msg));
  }
  wrap.append(ex, box);
  main.append(wrap);
}

// ---------- keys ----------
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return;
  const tab = curTab(); if (!tab.src || !$(".card")) return;
  if (e.key === "j") go((S.pos[tab.id] || 0) + 1);
  else if (e.key === "k") go((S.pos[tab.id] || 0) - 1);
  else if (e.key === "n") nextTodo();
});

// ---------- boot ----------
function conn(msg, bad = false) { const c = $("#conn"); c.textContent = msg; c.classList.toggle("bad", bad); }
function banner(msg) { $("#bannerText").textContent = msg; $("#banner").hidden = !msg; }
function onServer() {
  const card = $(".card");
  const tab = curTab();
  if (card && card._sync && tab.coll && !S.local[tab.coll][card._id]) card._sync();
  if (tab.id === "export" || (tab.lockOf && $(".lock"))) render();
  else {
    renderTabs();
    for (const it of itemsOf(tab)) { const d = document.getElementById("dot-" + it.item); if (d) d.className = "dot " + status(kindOf(it), val(tab.coll, it.item), it); }
  }
}
// Outside claude.ai (a local build opened in a browser) answers live in localStorage,
// behind the same calls the page makes on the artifact's store.
function localDb(name) {
  const key = c => "goldset." + name + "." + c, subs = {};
  const read = c => { try { return JSON.parse(localStorage.getItem(key(c))) || {}; } catch { return {}; } };
  const snap = c => ({ docs: Object.entries(read(c)).map(([id, d]) => ({ id, exists: true, data: () => d })) });
  const write = (c, m) => { localStorage.setItem(key(c), JSON.stringify(m)); (subs[c] || []).forEach(f => f(snap(c))); };
  localStorage.setItem(key("probe"), "{}"); localStorage.removeItem(key("probe"));
  window.addEventListener("storage", e => {
    if (!e.key) return;
    for (const c of Object.keys(subs)) if (e.key === key(c)) subs[c].forEach(f => f(snap(c)));
  });
  return {
    all: read, replace: write,
    collection: c => ({
      doc: id => ({ async set(body) { const m = read(c); m[id] = body; write(c, m); } }),
      onSnapshot(next) { (subs[c] ||= []).push(next); setTimeout(() => next(snap(c)), 0); return () => {}; },
    }),
  };
}
// A contributor's hosted page (kit --repo) keeps answers in this browser first and commits the sheets to the
// contributor's repository a few seconds after each change, with the key from their personal link (#key=…).
// Each edited row is tracked in a dirty map so concurrent tabs and conflict retries keep local edits while
// adopting remote answers for clean rows; without a key, edits stay dirty until the personal link opens.
function githubSync(gh, db) {
  const name = S.data.dump + "." + gh.annotator;
  const m = location.hash.match(/(?:^#|&)key=([\w-]+)/);
  if (m) { store.set("key." + name, m[1]); history.replaceState(null, "", location.pathname + location.search); }
  const key = store.get("key." + name);
  // One key per edited row (goldset.dirty.<dump>.<annotator>.answers/C001 → seq), so two tabs never rewrite
  // each other's markers.
  const dk = "dirty." + name + ".";
  const dirtyNow = () => {
    const m = {}, p = "goldset." + dk;
    try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith(p)) m[k.slice(p.length)] = store.get(dk + k.slice(p.length)); } } catch {}
    return m;
  };
  // Throws when storage is full, so the save fails visibly instead of storing an unmarked answer.
  const mark = (coll, id) => { const k = dk + coll + "/" + id; localStorage.setItem("goldset." + k, JSON.stringify(Math.max(Date.now(), (store.get(k) || 0) + 1))); };
  // Marking and saving a row, clearing markers and merging a loaded sheet run one at a time across this browser's tabs.
  const locked = f => navigator.locks ? navigator.locks.request("goldset." + dk, f) : f();
  let dead = false;
  let onEdit = () => {};
  const wrapper = {
    collection: c => ({
      doc: id => ({ async set(body) {
        // Practice answers never leave the browser. The marker goes first: an answer is never stored unmarked.
        if (c === "practice") return db.collection(c).doc(id).set(body);
        await locked(async () => { mark(c, id); await db.collection(c).doc(id).set(body); });
        onEdit();
      } }),
      onSnapshot: (...a) => db.collection(c).onSnapshot(...a),
    }),
  };
  if (!key) return { db: wrapper, live: false };
  const api = "https://api.github.com/repos/" + gh.repo + "/contents/" + gh.dir + "/";
  const headers = { Authorization: "Bearer " + key, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" };
  const sheets = SHEETS.filter(([src]) => S.data[src].length);
  const sha = {}, sent = {};
  let timer = null, busy = false, again = false, loaded = false, wait = 0;
  const time = () => new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  const b64 = text => {
    const bytes = new TextEncoder().encode(text); let s = "";
    for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
    return btoa(s);
  };
  const unb64 = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, "")), c => c.charCodeAt(0)));
  async function get(file) {
    const res = await fetch(api + file + "?ref=" + enc(gh.branch), { headers, cache: "no-store" });
    if (!res.ok) throw res;
    const body = await res.json();
    sha[file] = body.sha;
    return unb64(body.content);
  }
  async function put(file, text, message, keepalive) {
    const res = await fetch(api + file, { method: "PUT", headers, keepalive, body: JSON.stringify({ message, content: b64(text), sha: sha[file], branch: gh.branch }) });
    if (!res.ok) throw res;
    sha[file] = (await res.json()).content.sha;
  }
  async function load() {
    for (const [src, coll, file] of sheets) {
      const text = await get(file);
      const fields = FIELDS[src.startsWith("composers") ? "c" : "w"];
      const known = new Set(S.data[src].map(it => it.item));
      const cell = c => /^".*"$/.test(c) ? c.slice(1, -1).replace(/""/g, '"') : c;
      const [head, ...rows] = text.split(/\r?\n/).filter(Boolean).map(l => l.split("\t").map(cell));
      await locked(() => {
        const have = db.all(coll);
        for (const r of rows) {
          const row = Object.fromEntries(head.map((h, i) => [h, r[i] ?? ""]));
          if (!known.has(row.item)) continue;
          if (store.get(dk + coll + "/" + row.item)) continue;
          const body = { item: row.item };
          for (const f of fields) body[f] = row[f] ?? "";
          if (fields.some(f => body[f])) have[row.item] = body;
          else delete have[row.item];
        }
        db.replace(coll, have);
      });
      sent[file] = text;
    }
    loaded = true;
  }
  function fail(res) {
    const denied = res && (res.status === 401 || res.status === 404 || (res.status === 403 && res.headers.get("x-ratelimit-remaining") !== "0" && !res.headers.get("retry-after")));
    if (denied) {
      dead = true; conn("Not saving to GitHub", true);
      banner("The key in your link doesn't work. Your answers are safe in this browser: keep working, and ask the person who invited you for a new link.");
      return;
    }
    wait = Math.min((wait || 7.5) * 2, 300);
    conn("Not saved to GitHub yet, retrying", true);
    // An edit made during the failed PUT set a short timer; the backoff replaces it.
    clearTimeout(timer); timer = null;
    schedule(wait * 1000);
  }
  function schedule(ms = 4000) {
    if (dead) return;
    if (wait > 0 && timer) return;
    clearTimeout(timer);
    timer = setTimeout(push, Math.max(ms, wait * 1000));
  }
  async function push(keepalive = false) {
    clearTimeout(timer); timer = null;
    if (dead) return;
    if (busy) { again = true; return; }
    busy = true;
    // What a push sends: the stored rows, read together with the markers rather than this tab's view (which another
    // tab's save reaches only with its storage event), plus this tab's unflushed edits.
    const stored = () => Object.fromEntries(sheets.map(([, coll]) => {
      const m = db.all(coll);
      for (const [id, v] of Object.entries(S.local[coll])) m[id] = { ...(m[id] || {}), ...v };
      return [coll, m];
    }));
    const snap = dirtyNow();
    let rows = stored();
    const ids = Object.keys(snap).map(k => k.slice(k.indexOf("/") + 1));
    const message = gh.annotator + ": " + (ids.length ? ids.slice(0, 8).join(", ") + (ids.length > 8 ? " and " + (ids.length - 8) + " more" : "") : "answers");
    try {
      if (!loaded) { conn("Loading from GitHub…"); await load(); rows = stored(); }
      let retried = false;
      for (;;) {
        let conflict = false;
        for (const [src, coll, file] of sheets) {
          const text = tsvFor(src, coll, rows[coll]);
          if (text === sent[file]) continue;
          conn("Saving to GitHub…");
          try { await put(file, text, message, keepalive); }
          catch (res) {
            if (!(res instanceof Response) || ![409, 422].includes(res.status)) throw res;
            if (retried) throw res;
            conflict = true;
            break;
          }
          sent[file] = text;
        }
        if (!conflict) break;
        retried = true;
        await load();
        rows = stored();
      }
      wait = 0;
      // A marker goes only while its stored row still holds what was sent: another tab writes its marker before its row.
      const fields = [...new Set([...FIELDS.c, ...FIELDS.w])];
      const same = (a = {}, b = {}) => fields.every(f => (a[f] ?? "") === (b[f] ?? ""));
      await locked(() => {
        const now = Object.fromEntries(Object.keys(rows).map(c => [c, db.all(c)]));
        for (const [k, v] of Object.entries(snap)) {
          const c = k.slice(0, k.indexOf("/")), id = k.slice(k.indexOf("/") + 1);
          if (store.get(dk + k) === v && (!rows[c] || same(now[c][id], rows[c][id]))) store.del(dk + k);
        }
      });
      conn(ids.length ? "Saved to GitHub " + time() : "Connected to GitHub");
    } catch (res) {
      fail(res instanceof Response ? res : null);
    } finally {
      busy = false;
      if (again) { again = false; schedule(); }
    }
  }
  onEdit = () => { if (!dead) { conn("Saving to GitHub…"); schedule(); } };
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") {
      // An edit still waiting for its flush goes in this push too (push sends this tab's unflushed edits).
      const unsaved = sheets.some(([, coll]) => Object.keys(S.local[coll]).length);
      if (loaded && (unsaved || Object.keys(dirtyNow()).length) && wait === 0) push(true);
    } else if (!dead) { loaded = false; schedule(0); }
  });
  schedule(0);
  return { db: wrapper, live: true };
}
async function boot() {
  try {
    S.data = JSON.parse($("#gold-data").textContent);
    $("#dumpid").textContent = S.data.dump;
    // Gold v2 sheets carry style answers on composers, before notes (as in the TSV).
    if (S.data.style) FIELDS.c.splice(FIELDS.c.indexOf("notes"), 0, "styles", "primary_period", "style_source");
  } catch (e) {
    $("#main").innerHTML = ""; $("#main").append(el("div", { class: "panel" }, el("h2", { text: "No items in this page" }), el("p", { text: "Build it from the sheets: python scripts/gold_set.py form --dump <dump>." })));
    return;
  }
  const gh = S.data.github;
  if (gh) {
    S.gh = true;
    $("#conn").after(el("span", { class: "top-links" }, ext(gh.guide, "Guide"), ext(gh.rules, "Rules")));
  }
  render();
  if (gh) {
    let db = null;
    try { db = localDb(S.data.dump + "." + gh.annotator); } catch {}
    if (!db) { conn("Not saving", true); banner("This browser blocks saving (private window?). Open your link in a normal window."); S.readOnly = true; return; }
    const sync = githubSync(gh, db);
    S.db = sync.db;
    if (!sync.live) {
      S.gh = false;
      banner("Open this page from your personal link to save your answers to GitHub. Until then they are saved in this browser only.");
    }
    return subscribe(true);
  }
  if (!window.claude?.use) {
    try { S.db = localDb(S.data.dump); } catch { S.db = null; }
    if (S.db) { banner("Local copy: answers are saved in this browser only. Copy them into data/gold/" + S.data.dump + "/ from Progress & export."); return subscribe(true); }
  }
  const db = window.claude?.use ? await window.claude.use("db").catch(() => null) : null;
  if (!db) {
    conn("Not connected", true);
    banner("Answers can't be saved in this view. Open the page on claude.ai while signed in; anything you click here is lost on reload.");
    S.readOnly = true;
    return;
  }
  S.db = db;
  const user = await window.claude.use("user").catch(() => null);
  if (user && (await user.isOwner().catch(() => true)) === false) {
    S.readOnly = true;
    banner("You can look through the items, but only the owner of this page can save answers.");
  }
  subscribe(false);
}
function subscribe(local) {
  let first = 0;
  for (const c of COLLS) {
    S.db.collection(c).onSnapshot(snap => {
      const m = {};
      for (const d of snap.docs) m[d.id] = d.data();
      S.server[c] = m;
      // On a hosted page githubSync reports the GitHub state instead.
      if (++first >= COLLS.length && !S.gh) conn(local ? "Saving in this browser" : S.readOnly ? "Read only" : "Saving to this page");
      onServer();
    }, err => {
      conn("Connection lost", true);
      banner("The answer store stopped responding (" + (err?.code || "error") + "). Reload the page before you continue; unsaved edits on screen will be lost.");
    });
  }
}
boot();
})();
